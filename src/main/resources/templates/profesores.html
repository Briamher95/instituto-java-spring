<!DOCTYPE html>
<!-- El dialecto SpringStandard de Thymeleaf reconoce los atributos con prefijo th:. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de profesores</title>
    <!-- Bootstrap 5.3 por CDN, con versión fija. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- th:replace reemplaza este elemento por el fragmento "encabezado". -->
    <header th:replace="~{fragments/header :: encabezado}"></header>

    <main class="container my-4 p-4 bg-white rounded shadow-sm">
        <h2>Listado de profesores</h2>

        <!-- Mensajes flash: llegan después de un redirect y se muestran una sola vez. -->
        <p class="mensaje mensaje-exito" th:if="${mensaje}" th:text="${mensaje}">Operación realizada</p>
        <p class="mensaje mensaje-error" th:if="${error}" th:text="${error}">Ocurrió un error</p>

        <div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
            <!-- Búsqueda por GET: el texto queda en la URL (?buscar=...). -->
            <form class="d-flex gap-2" th:action="@{/profesores}" method="get">
                <input type="search" class="form-control" name="buscar"
                       placeholder="Buscar por apellido" th:value="${buscar}">
                <button class="btn btn-outline-secondary" type="submit">Buscar</button>
                <a class="btn btn-link" th:if="${buscar}" th:href="@{/profesores}">Ver todos</a>
            </form>

            <a class="btn btn-primary" th:href="@{/profesores/nuevo}">Nuevo profesor</a>
        </div>

        <table class="table table-striped align-middle">
            <thead>
                <tr>
                    <th>DNI</th>
                    <th>Apellido</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                <!-- th:each repite la fila por cada profesor de la lista del modelo. -->
                <tr th:each="profesor : ${profesores}">
                    <td th:text="${profesor.dni}">12345678</td>
                    <td th:text="${profesor.apellido}">Pérez</td>
                    <td th:text="${profesor.nombre}">Ana</td>
                    <td th:text="${profesor.email}">ana@correo.com</td>
                    <td th:text="${profesor.telefono}">1122334455</td>
                    <td th:text="${profesor.activo} ? 'Activo' : 'Inactivo'">Activo</td>
                    <td>
                        <div class="d-flex flex-wrap gap-1">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/profesores/{id}/editar(id=${profesor.id})}">Editar</a>

                            <!-- Las acciones que modifican datos van siempre por POST. -->
                            <form th:if="${profesor.activo}" method="post"
                                  th:action="@{/profesores/{id}/baja(id=${profesor.id})}">
                                <button class="btn btn-sm btn-outline-warning" type="submit">Dar de baja</button>
                            </form>

                            <form th:unless="${profesor.activo}" method="post"
                                  th:action="@{/profesores/{id}/reactivar(id=${profesor.id})}">
                                <button class="btn btn-sm btn-outline-success" type="submit">Reactivar</button>
                            </form>

                            <!-- confirm() pide confirmación en el navegador antes de enviar. -->
                            <form method="post"
                                  th:action="@{/profesores/{id}/eliminar(id=${profesor.id})}"
                                  onsubmit="return confirm('¿Eliminar definitivamente este profesor?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>

                <!-- th:if muestra la fila solo si la lista está vacía. -->
                <tr th:if="${#lists.isEmpty(profesores)}">
                    <td colspan="7">No hay profesores para mostrar.</td>
                </tr>
            </tbody>
        </table>
    </main>

</body>
</html>
