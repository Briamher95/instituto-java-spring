<!DOCTYPE html>
<!-- El dialecto SpringStandard de Thymeleaf reconoce los atributos con prefijo th:. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asignar profesor</title>
    <!-- Bootstrap 5.3 por CDN, con versión fija. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- th:replace reemplaza este elemento por el fragmento "encabezado". -->
    <header th:replace="~{fragments/header :: encabezado}"></header>

    <main class="container my-4 p-4 bg-white rounded shadow-sm">
        <h2>Asignar profesor</h2>

        <!-- Error de regla de negocio que manda el controlador. -->
        <p class="mensaje mensaje-error" th:if="${error}" th:text="${error}">Ocurrió un error</p>

        <p>
            Curso: <strong th:text="${curso.nombre}">Programación</strong><br>
            Profesor actual:
            <strong th:text="${curso.profesor != null}
                             ? ${curso.profesor.apellido + ', ' + curso.profesor.nombre}
                             : 'Sin profesor'">Sin profesor</strong>
        </p>

        <!-- Sin profesores activos no hay nada para elegir: lo decimos en lugar de mostrar el select. -->
        <div th:if="${#lists.isEmpty(profesores)}">
            <p class="mensaje mensaje-error">No hay profesores activos para asignar. Registrá o reactivá un profesor primero.</p>
            <a class="btn btn-secondary" th:href="@{/cursos}">Volver</a>
        </div>

        <!-- Asignar uno nuevo reemplaza al anterior: un curso tiene un solo profesor. -->
        <form th:unless="${#lists.isEmpty(profesores)}"
              th:action="@{/cursos/{id}/profesor(id=${curso.id})}" method="post" style="max-width: 450px;">

            <div class="mb-3">
                <label class="form-label" for="idProfesor">Profesor:</label>
                <select class="form-select" id="idProfesor" name="idProfesor" required>
                    <option value="">Elegí un profesor</option>
                    <!-- th:selected deja marcado al profesor actual, si lo tiene. -->
                    <option th:each="profesor : ${profesores}"
                            th:value="${profesor.id}"
                            th:text="${profesor.apellido + ', ' + profesor.nombre + ' (DNI ' + profesor.dni + ')'}"
                            th:selected="${curso.profesor != null and curso.profesor.id == profesor.id}">Pérez, Ana (DNI 12345678)</option>
                </select>
            </div>

            <button class="btn btn-primary" type="submit">Asignar</button>
            <a class="btn btn-secondary" th:href="@{/cursos}">Cancelar</a>
        </form>
    </main>

</body>
</html>
