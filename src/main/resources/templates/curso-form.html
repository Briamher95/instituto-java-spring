<!DOCTYPE html>
<!-- El dialecto SpringStandard de Thymeleaf reconoce los atributos con prefijo th:. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${idCurso} ? 'Editar curso' : 'Nuevo curso'">Curso</title>
    <!-- Bootstrap 5.3 por CDN, con versión fija. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- th:replace reemplaza este elemento por el fragmento "encabezado". -->
    <header th:replace="~{fragments/header :: encabezado}"></header>

    <main class="container my-4 p-4 bg-white rounded shadow-sm">
        <h2 th:text="${idCurso} ? 'Editar curso' : 'Registrar curso'">Registrar curso</h2>

        <!-- Error de validación o de regla de negocio que manda el controlador. -->
        <p class="mensaje mensaje-error" th:if="${error}" th:text="${error}">Ocurrió un error</p>

        <!-- Un solo formulario para alta y edición: si hay idCurso, se envía a /cursos/{id}. -->
        <!-- required, min y maxlength los revisa el navegador; el servicio vuelve a validar. -->
        <!-- El profesor no se elige acá: se asigna desde el listado con "Asignar profesor". -->
        <form th:action="${idCurso} ? @{/cursos/{id}(id=${idCurso})} : @{/cursos}"
              th:object="${curso}" method="post" style="max-width: 450px;">

            <div class="mb-3">
                <label class="form-label" for="nombre">Nombre:</label>
                <!-- th:field vincula el campo y conserva lo escrito si volvemos con un error. -->
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" maxlength="50" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="cupoMaximo">Cupo máximo:</label>
                <!-- step="1": el navegador solo acepta números enteros. -->
                <input type="number" class="form-control" id="cupoMaximo" th:field="*{cupoMaximo}"
                       min="1" step="1" required>
            </div>

            <button class="btn btn-primary" type="submit">Guardar</button>

            <!-- th:href genera el enlace para volver al listado de cursos. -->
            <a class="btn btn-secondary" th:href="@{/cursos}">Cancelar</a>

        </form>
    </main>

</body>
</html>
