<!DOCTYPE html>
<!-- El dialecto SpringStandard de Thymeleaf reconoce los atributos con prefijo th:. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo alumno</title>
    <!-- Bootstrap 5.3 por CDN, con versión fija. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- th:replace reemplaza este elemento por el fragmento "encabezado". -->
    <header th:replace="~{fragments/header :: encabezado}"></header>

    <main class="container my-4 p-4 bg-white rounded shadow-sm">
        <h2>Registrar alumno</h2>

        <!-- th:action genera la URL a la que se envía el formulario. -->
        <!-- th:object selecciona el objeto "alumno" que el controlador agregó al modelo. -->
        <form th:action="@{/alumnos}" th:object="${alumno}" method="post" style="max-width: 450px;">

            <div class="mb-3">
                <label class="form-label" for="dni">DNI:</label>
                <!-- th:field vincula el campo con la propiedad "dni" del objeto seleccionado. -->
                <input type="text" class="form-control" id="dni" th:field="*{dni}" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="nombre">Nombre:</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="apellido">Apellido:</label>
                <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email:</label>
                <input type="email" class="form-control" id="email" th:field="*{email}">
            </div>

            <div class="mb-3">
                <label class="form-label" for="telefono">Teléfono:</label>
                <input type="text" class="form-control" id="telefono" th:field="*{telefono}">
            </div>

            <button class="btn btn-primary" type="submit">Guardar</button>

            <!-- th:href genera el enlace para volver al listado de alumnos. -->
            <a class="btn btn-secondary" th:href="@{/alumnos}">Cancelar</a>

        </form>
    </main>

</body>
</html>
