<!DOCTYPE html>
<!-- El dialecto SpringStandard de Thymeleaf reconoce los atributos con prefijo th:. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de alumnos</title>
    <!-- Bootstrap 5.3 por CDN, con versión fija. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- th:replace reemplaza este elemento por el fragmento "encabezado". -->
    <header th:replace="~{fragments/header :: encabezado}"></header>

    <main class="container my-4 p-4 bg-white rounded shadow-sm">
        <h2>Listado de alumnos</h2>

        <p>
            <!-- th:href genera la URL del formulario de alta. -->
            <a class="btn btn-primary" th:href="@{/alumnos/nuevo}">Registrar un alumno</a>
        </p>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>DNI</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                </tr>
            </thead>

            <tbody>
                <!-- th:each repite la fila por cada alumno de la lista del modelo. -->
                <tr th:each="alumno : ${alumnos}">
                    <!-- th:text reemplaza el texto de ejemplo por el valor de cada propiedad. -->
                    <td th:text="${alumno.nombre}">Ana</td>
                    <td th:text="${alumno.apellido}">Pérez</td>
                    <td th:text="${alumno.dni}">12345678</td>
                    <td th:text="${alumno.email}">ana@correo.com</td>
                    <td th:text="${alumno.telefono}">1122334455</td>
                </tr>

                <!-- th:if muestra la fila solo si la lista está vacía. -->
                <tr th:if="${#lists.isEmpty(alumnos)}">
                    <td colspan="5">Todavía no hay alumnos registrados.</td>
                </tr>
            </tbody>
        </table>
    </main>

</body>
</html>
