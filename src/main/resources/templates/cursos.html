<!DOCTYPE html>
<!-- El dialecto SpringStandard de Thymeleaf reconoce los atributos con prefijo th:. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de cursos</title>
    <!-- Bootstrap 5.3 por CDN, con versión fija. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- th:replace reemplaza este elemento por el fragmento "encabezado". -->
    <header th:replace="~{fragments/header :: encabezado}"></header>

    <main class="container my-4 p-4 bg-white rounded shadow-sm">
        <h2>Listado de cursos</h2>

        <!-- Mensajes flash: llegan después de un redirect y se muestran una sola vez. -->
        <p class="mensaje mensaje-exito" th:if="${mensaje}" th:text="${mensaje}">Operación realizada</p>
        <p class="mensaje mensaje-error" th:if="${error}" th:text="${error}">Ocurrió un error</p>

        <div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
            <!-- Búsqueda por GET: el texto queda en la URL (?buscar=...). -->
            <form class="d-flex gap-2" th:action="@{/cursos}" method="get">
                <input type="search" class="form-control" name="buscar"
                       placeholder="Buscar por nombre" th:value="${buscar}">
                <button class="btn btn-outline-secondary" type="submit">Buscar</button>
                <a class="btn btn-link" th:if="${buscar}" th:href="@{/cursos}">Ver todos</a>
            </form>

            <a class="btn btn-primary" th:href="@{/cursos/nuevo}">Nuevo curso</a>
        </div>

        <table class="table table-striped align-middle">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Cupo máximo</th>
                    <th>Inscriptos</th>
                    <th>Cupo disponible</th>
                    <th>Profesor</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                <!-- th:each repite la fila por cada curso de la lista del modelo. -->
                <tr th:each="curso : ${cursos}">
                    <td th:text="${curso.nombre}">Programación</td>
                    <td th:text="${curso.cupoMaximo}">30</td>
                    <td th:text="${#lists.size(curso.inscripciones)}">5</td>
                    <!-- cupoDisponible() es un valor calculado, no un campo guardado. -->
                    <td th:text="${curso.cupoDisponible()}">25</td>
                    <td th:text="${curso.profesor != null}
                                 ? ${curso.profesor.apellido + ', ' + curso.profesor.nombre}
                                 : 'Sin profesor'">Pérez, Ana</td>
                    <td th:text="${curso.activo} ? 'Activo' : 'Inactivo'">Activo</td>
                    <td>
                        <div class="d-flex flex-wrap gap-1">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/cursos/{id}/editar(id=${curso.id})}">Editar</a>

                            <!-- Solo un curso activo puede recibir profesor. -->
                            <a class="btn btn-sm btn-outline-secondary" th:if="${curso.activo}"
                               th:href="@{/cursos/{id}/profesor(id=${curso.id})}"
                               th:text="${curso.profesor != null} ? 'Cambiar profesor' : 'Asignar profesor'">Asignar profesor</a>

                            <!-- Las acciones que modifican datos van siempre por POST. -->
                            <form th:if="${curso.profesor != null}" method="post"
                                  th:action="@{/cursos/{id}/profesor/quitar(id=${curso.id})}">
                                <button class="btn btn-sm btn-outline-secondary" type="submit">Quitar profesor</button>
                            </form>

                            <!-- La baja borra las inscripciones del curso: se avisa antes de enviar. -->
                            <form th:if="${curso.activo}" method="post"
                                  th:action="@{/cursos/{id}/baja(id=${curso.id})}"
                                  onsubmit="return confirm('¿Dar de baja este curso? Se eliminarán todas sus inscripciones.');">
                                <button class="btn btn-sm btn-outline-warning" type="submit">Dar de baja</button>
                            </form>

                            <form th:unless="${curso.activo}" method="post"
                                  th:action="@{/cursos/{id}/reactivar(id=${curso.id})}">
                                <button class="btn btn-sm btn-outline-success" type="submit">Reactivar</button>
                            </form>

                            <!-- confirm() pide confirmación en el navegador antes de enviar. -->
                            <form method="post"
                                  th:action="@{/cursos/{id}/eliminar(id=${curso.id})}"
                                  onsubmit="return confirm('¿Eliminar definitivamente este curso?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>

                <!-- th:if muestra la fila solo si la lista está vacía. -->
                <tr th:if="${#lists.isEmpty(cursos)}">
                    <td colspan="7">No hay cursos para mostrar.</td>
                </tr>
            </tbody>
        </table>
    </main>

</body>
</html>
